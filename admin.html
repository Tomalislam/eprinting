<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E Printing Service - Admin Dashboard</title>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="admin.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4361ee;
      --primary-light: #4895ef;
      --secondary: #3f37c9;
      --success: #4cc9f0;
      --warning: #f72585;
      --dark: #212529;
      --light: #f8f9fa;
      --gray: #6c757d;
      --card-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.2);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 28px;
      color: var(--primary);
    }

    .logo-text {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(to right, var(--primary), var(--warning));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .admin-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .admin-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    .admin-name {
      font-weight: 500;
    }

    .main-content {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 20px;
    }

    .sidebar {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: var(--card-shadow);
      height: fit-content;
    }

    .nav-title {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--gray);
      letter-spacing: 1px;
      margin: 20px 0 10px 0;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 5px;
      cursor: pointer;
      transition: var(--transition);
      color: var(--gray);
      font-weight: 500;
    }

    .nav-item.active, .nav-item:hover {
      background: var(--primary);
      color: white;
    }

    .nav-item.active i, .nav-item:hover i {
      color: white;
    }

    .content-area {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: var(--card-shadow);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--dark);
    }

    .search-box {
      position: relative;
      width: 300px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 15px 10px 40px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      transition: var(--transition);
      font-size: 14px;
    }

    .search-box input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--card-shadow);
      transition: var(--transition);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px -15px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--dark);
    }

    .card-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 15px;
      border-radius: 6px;
      border: none;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--secondary);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline:hover {
      background: var(--primary);
      color: white;
    }

    .btn-danger {
      background: var(--warning);
      color: white;
    }

    .btn-danger:hover {
      background: #d91a6d;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--dark);
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      transition: var(--transition);
      font-size: 14px;
    }

    .form-control:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper::after {
      content: '\f078';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
      pointer-events: none;
    }

    .form-select {
      appearance: none;
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      transition: var(--transition);
      font-size: 14px;
      cursor: pointer;
    }

    .form-select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }

    .order-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .order-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--card-shadow);
      transition: var(--transition);
      border-top: 4px solid var(--primary);
    }

    .order-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px -15px rgba(0, 0, 0, 0.3);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f0f0f0;
    }

    .order-id {
      font-size: 14px;
      color: var(--gray);
    }

    .order-status {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-confirmed { background: rgba(76, 201, 240, 0.1); color: var(--success); }
    .status-printing { background: rgba(67, 97, 238, 0.1); color: var(--primary); }
    .status-printed { background: rgba(60, 183, 120, 0.1); color: #3cb778; }
    .status-shipping { background: rgba(255, 193, 7, 0.1); color: #ffc107; }
    .status-shipped { background: rgba(247, 37, 133, 0.1); color: var(--warning); }
    .status-delivered { background: rgba(40, 167, 69, 0.1); color: #28a745; }

    .order-details {
      margin-bottom: 15px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .detail-label {
      font-weight: 500;
      color: var(--gray);
    }

    .detail-value {
      color: var(--dark);
    }

    .order-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .hidden {
      display: none;
    }

    /* Costs Section */
    .cost-item {
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      background: #f8f9fa;
    }

    .cost-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 500;
    }

    /* Responsive Styles */
    @media (max-width: 992px) {
      .main-content {
        grid-template-columns: 1fr;
      }
      
      .sidebar {
        display: none;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .section-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
      
      .search-box {
        width: 100%;
      }
      
      .order-list {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .admin-profile {
        margin-top: 10px;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- Login Form -->
  <div id="loginForm" class="login-container">
    <div class="login-logo">
      <i class="fas fa-print"></i>
    </div>
    <h1 class="login-title">Admin Login</h1>
    <form class="login-form" id="loginFormElement">
      <div class="form-group">
        <label for="adminEmail" class="form-label">Email Address</label>
        <input type="email" id="adminEmail" class="form-control" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="adminPassword" class="form-label">Password</label>
        <input type="password" id="adminPassword" class="form-control" placeholder="Enter your password" required>
      </div>
      <button type="submit" id="loginBtn" class="login-btn">Sign In</button>
    </form>
  </div>

  <!-- Admin Dashboard -->
  <div id="adminPanel" class="dashboard-container hidden">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <i class="fas fa-print"></i>
        </div>
        <div class="logo-text">E Printing Service</div>
      </div>
      <div class="admin-profile">
        <div class="admin-avatar">A</div>
        <div class="admin-name">Admin</div>
      </div>
    </div>

    <div class="main-content">
      <div class="sidebar">
        <div class="nav-title">Main Menu</div>
        <div class="nav-item active" id="dashboardTab">
          <i class="fas fa-tachometer-alt"></i>
          Dashboard
        </div>
        <div class="nav-item" id="addNewOrderTab">
          <i class="fas fa-plus-circle"></i>
          Add New Order
        </div>
        <div class="nav-item" id="allOrdersTab">
          <i class="fas fa-list-ul"></i>
          All Orders
        </div>
        <div class="nav-item" id="costsTab">
          <i class="fas fa-calculator"></i>
          Costs
        </div>
        
        <div class="nav-title">Settings</div>
        <div class="nav-item">
          <i class="fas fa-cog"></i>
          Settings
        </div>
        <div class="nav-item" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i>
          Logout
        </div>
      </div>

      <div class="content-area">
        <!-- Dashboard Section -->
        <div id="dashboardSection">
          <div class="section-header">
            <h2 class="section-title">Dashboard Overview</h2>
            <div class="search-box">
              <i class="fas fa-search"></i>
              <input type="text" placeholder="Search..." id="dashboardSearch">
            </div>
          </div>

          <div class="stats-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px;">
            <!-- Add Net Profit Card -->
            <div class="card">
              <div class="card-header">
                <div class="card-title">Net Profit</div>
                <i class="fas fa-coins" style="color: #28a745;"></i>
              </div>
              <div style="font-size: 28px; font-weight: 600;" id="netProfitValue">৳0</div>
            </div>
            
            <!-- Existing stats cards... -->
          </div>

          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Recent Orders (Pending)</h3>
              <button class="btn btn-outline" id="viewAllOrders">View All</button>
            </div>
            <div class="order-list" id="recentOrders">
              <!-- Recent pending orders -->
            </div>
          </div>
        </div>

        <!-- Add New Order Section -->
        <div id="addOrderSection" class="hidden">
          <!-- Updated order form with due field -->
        </div>

        <!-- All Orders Section -->
        <div id="orderListSection" class="hidden">
          <!-- Orders list with search -->
        </div>

        <!-- Costs Section -->
        <div id="costsSection" class="hidden">
          <!-- Costs management interface -->
        </div>
      </div>
    </div>
  </div>
</body>
</html>
