<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E Printing Service - Admin Dashboard</title>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="admin.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --warning: #f72585;
            --dark: #212529;
            --light: #f8f9fa;
            --gray: #6c757d;
            --card-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.2);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
        }

        .hidden {
            display: none;
        }

        /* Enhanced Login Form */
        .login-container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, var(--primary), var(--primary-light));
            animation: rotate 6s linear infinite;
            z-index: 0;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .login-content {
            position: relative;
            z-index: 1;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .login-logo {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 20px;
            text-align: center;
            animation: bounce 1.5s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--dark);
            text-align: center;
        }

        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .login-btn:hover {
            background: var(--secondary);
        }

        /* Admin Dashboard Styles */
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 28px;
            color: var(--primary);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--warning));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .main-content {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: var(--card-shadow);
        }

        .nav-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--gray);
            letter-spacing: 1px;
            margin: 20px 0 10px 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--gray);
            font-weight: 500;
        }

        .nav-item.active, .nav-item:hover {
            background: var(--primary);
            color: white;
        }

        .content-area {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: var(--card-shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--dark);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--card-shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
        }

        .order-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .order-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            border-top: 4px solid var(--primary);
        }

        .order-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-confirmed { background: rgba(76, 201, 240, 0.1); color: var(--success); }
        .status-printing { background: rgba(67, 97, 238, 0.1); color: var(--primary); }
        .status-printed { background: rgba(60, 183, 120, 0.1); color: #3cb778; }
        .status-shipping { background: rgba(255, 193, 7, 0.1); color: #ffc107; }
        .status-shipped { background: rgba(247, 37, 133, 0.1); color: var(--warning); }
        .status-delivered { background: rgba(40, 167, 69, 0.1); color: #28a745; }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-label {
            font-weight: 500;
            color: var(--gray);
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                display: none;
            }
            
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Enhanced Login Form -->
    <div id="loginForm" class="login-container">
        <div class="login-content">
            <div class="login-logo">
                <i class="fas fa-print"></i>
            </div>
            <h1 class="login-title">Admin Login</h1>
            <form class="login-form" id="loginFormElement">
                <div class="form-group">
                    <input type="email" id="adminEmail" class="form-control" placeholder=" " required>
                    <label for="adminEmail">Email Address</label>
                </div>
                <div class="form-group">
                    <input type="password" id="adminPassword" class="form-control" placeholder=" " required>
                    <label for="adminPassword">Password</label>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminPanel" class="dashboard-container hidden">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-print"></i>
                </div>
                <div class="logo-text">E Printing Service</div>
            </div>
            <div class="admin-profile">
                <div class="admin-avatar">A</div>
                <div class="admin-name">Admin</div>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div class="nav-title">Main Menu</div>
                <div class="nav-item active" id="dashboardTab">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </div>
                <div class="nav-item" id="addNewOrderTab">
                    <i class="fas fa-plus-circle"></i> Add Order
                </div>
                <div class="nav-item" id="allOrdersTab">
                    <i class="fas fa-list-ul"></i> All Orders
                </div>
                <div class="nav-item" id="costsTab">
                    <i class="fas fa-calculator"></i> Costs
                </div>

                <div class="nav-title">Settings</div>
                <div class="nav-item" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </div>
            </div>

            <div class="content-area">
                <!-- Dashboard Section -->
                <div id="dashboardSection">
                    <div class="section-header">
                        <h2 class="section-title">Dashboard Overview</h2>
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="dashboardSearch" placeholder="Search orders...">
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="card">
                            <div class="card-header">
                                <div class="card-title">Total Orders</div>
                                <i class="fas fa-boxes" style="color: var(--primary);"></i>
                            </div>
                            <div id="totalOrdersValue" style="font-size: 28px; font-weight: 600;">0</div>
                        </div>
                        <div class="card">
                            <div class="card-header">
                                <div class="card-title">Pending Orders</div>
                                <i class="fas fa-clock" style="color: #ffc107;"></i>
                            </div>
                            <div id="pendingOrdersValue" style="font-size: 28px; font-weight: 600;">0</div>
                        </div>
                        <div class="card">
                            <div class="card-header">
                                <div class="card-title">Completed Orders</div>
                                <i class="fas fa-check-circle" style="color: #28a745;"></i>
                            </div>
                            <div id="completedOrdersValue" style="font-size: 28px; font-weight: 600;">0</div>
                        </div>
                        <div class="card">
                            <div class="card-header">
                                <div class="card-title">Net Profit</div>
                                <i class="fas fa-coins" style="color: #28a745;"></i>
                            </div>
                            <div id="netProfitValue" style="font-size: 28px; font-weight: 600;">৳0</div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Recent Pending Orders</h3>
                            <button class="btn btn-outline" id="viewAllOrders">View All</button>
                        </div>
                        <div class="order-list" id="recentOrders"></div>
                    </div>
                </div>

                <!-- Add New Order Section -->
                <div id="addOrderSection" class="hidden">
                    <div class="section-header">
                        <h2 class="section-title">Add New Order</h2>
                    </div>
                    <div class="card">
                        <form id="orderForm">
                            <div class="form-group">
                                <label for="name">Customer Name</label>
                                <input type="text" id="name" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" id="phone" class="form-control" pattern="01\d{9}" required>
                            </div>
                            <div class="form-group">
                                <label for="address">Delivery Address</label>
                                <input type="text" id="address" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="driveLink">Google Drive Link</label>
                                <input type="url" id="driveLink" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="totalPrice">Order Total (৳)</label>
                                <input type="number" id="totalPrice" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="deliveryCharge">Delivery Charge (৳)</label>
                                <input type="number" id="deliveryCharge" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="dueAmount">Due Amount (৳)</label>
                                <input type="number" id="dueAmount" class="form-control">
                            </div>
                            <button type="button" id="addOrderBtn" class="btn btn-primary">
                                <i class="fas fa-plus"></i> Add Order
                            </button>
                        </form>
                    </div>
                </div>

                <!-- All Orders Section -->
                <div id="orderListSection" class="hidden">
                    <div class="section-header">
                        <h2 class="section-title">All Orders</h2>
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchOrders" placeholder="Search orders...">
                        </div>
                    </div>
                    <div class="order-list" id="orderList"></div>
                </div>

                <!-- Costs Section -->
                <div id="costsSection" class="hidden">
                    <div class="section-header">
                        <h2 class="section-title">Cost Management</h2>
                    </div>
                    <div class="card">
                        <form id="costForm">
                            <div class="form-group">
                                <label for="costAmount">Amount (৳)</label>
                                <input type="number" id="costAmount" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="costCategory">Category</label>
                                <input type="text" id="costCategory" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="costDescription">Description</label>
                                <textarea id="costDescription" class="form-control"></textarea>
                            </div>
                            <button type="button" id="addCostBtn" class="btn btn-primary">
                                <i class="fas fa-plus"></i> Add Cost
                            </button>
                        </form>
                        <div class="costs-list" id="costsList" style="margin-top: 20px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
