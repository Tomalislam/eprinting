<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E Printing Service - Admin Panel</title>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="admin.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .website-name {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1, h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #444;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #0056b3;
        }

        ul {
            list-style: none;
            margin-top: 20px;
        }

        li {
            background: #f9f9f9;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="website-name">E Printing Service</div>

    <div class="container">
        <h1>Admin Login</h1>

        <div id="loginForm">
            <input type="email" id="adminEmail" placeholder="Email">
            <input type="password" id="adminPassword" placeholder="Password">
            <button id="loginBtn">Login</button>
        </div>

        <div id="adminPanel" class="hidden">
            <h2>Add New Order</h2>
            <input type="text" id="name" placeholder="Customer Name">
            <input type="text" id="address" placeholder="Address">
            <input type="text" id="phone" placeholder="Phone">
            <input type="text" id="driveLink" placeholder="Drive Link">
            <input type="number" id="totalPrice" placeholder="Total Price">
            <select id="deliverySystem">
                <option value="" disabled selected>Choose Delivery System</option>
                <option value="Sundorbon Delivery">Sundorbon Delivery</option>
                <option value="Home Delivery">Home Delivery</option>
            </select>
            <input type="number" id="deliveryCharge" placeholder="Delivery Charge">
            <select id="status">
                <option value="" disabled selected>Choose Order Status</option>
                <option value="Order Confirmed">Order Confirmed</option>
                <option value="Printing Your Order">Printing Your Order</option>
                <option value="Your Order Has Been Printed">Your Order Has Been Printed</option>
                <option value="Ready for Shipping">Ready for Shipping</option>
                <option value="Shipped">Shipped</option>
                <option value="Delivered">Delivered</option>
            </select>
            <button id="addOrderBtn">Add Order</button>

            <h2>All Orders</h2>
            <ul id="orderList"></ul>
        </div>
    </div>
</body>
</html>
