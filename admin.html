<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E Printing Service - Admin Panel</title>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="admin.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    
    /* same style as you gave */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #f5f5f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .website-name { font-size: 32px; font-weight: 600; margin-bottom: 20px; color: #333; }
    .container { background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 600px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1, h2 { margin-bottom: 20px; text-align: center; color: #444; }
    input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #0056b3; }
    ul { list-style: none; margin-top: 20px; }
    li { background: #f9f9f9; margin-bottom: 10px; padding: 10px; border-radius: 5px; }
    .hidden { display: none; }
    .nav-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
 

    /* Small change for new features: */
    #menuButtons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    .search-bar {
      margin: 10px 0;
    }
    .edit-button, .save-button {
      margin-top: 5px;
      font-size: 12px;
      padding: 5px;
      background: #28a745;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }
    .save-button {
      background: #ffc107;
    }
  </style>
</head>
<body>
  <div class="website-name">E Printing Service</div>

  <div class="container">
    <h1 id="sectionTitle">Admin Login</h1>

    <div id="loginForm">
      <input type="email" id="adminEmail" placeholder="Email">
      <input type="password" id="adminPassword" placeholder="Password">
      <button id="loginBtn">Login</button>
    </div>

    <div id="adminPanel" class="hidden">
      <div id="menuButtons">
        <button id="addNewOrderTab">Add New Order</button>
        <button id="allOrdersTab">All Orders</button>
      </div>

      <div id="addOrderSection">
        <input type="text" id="name" placeholder="Customer Name">
        <input type="text" id="address" placeholder="Address">
        <input type="text" id="phone" placeholder="Phone">
        <input type="text" id="driveLink" placeholder="Drive Link">
        <input type="number" id="totalPrice" placeholder="Total Price">
        <select id="deliverySystem">
          <option value="" disabled selected>Choose Delivery System</option>
          <option value="Sundorbon Delivery">Sundorbon Delivery</option>
          <option value="Home Delivery">Home Delivery</option>
        </select>
        <input type="number" id="deliveryCharge" placeholder="Delivery Charge">
        <select id="status">
          <option value="" disabled selected>Choose Order Status</option>
          <option value="Order Confirmed">Order Confirmed</option>
          <option value="Printing Your Order">Printing Your Order</option>
          <option value="Your Order Has Been Printed">Your Order Has Been Printed</option>
          <option value="Ready for Shipping">Ready for Shipping</option>
          <option value="Shipped">Shipped</option>
          <option value="Delivered">Delivered</option>
        </select>
        <button id="addOrderBtn">Add Order</button>
      </div>

      <div id="orderListSection" class="hidden">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search by Name or Phone">
        <ul id="orderList"></ul>
      </div>
    </div>
  </div>
</body>
</html>
