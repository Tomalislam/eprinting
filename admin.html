<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E Printing Admin</title>
    <script type="module" src="admin.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --warning: #f72585;
            --dark: #212529;
            --light: #f8f9fa;
            --gray: #6c757d;
            --card-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.2);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
        }

        .hidden {
            display: none;
        }

        /* Login Styles */
        .login-container {
            /* Previous login styles */
        }

        /* Dashboard Styles */
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: var(--card-shadow);
        }

        .order-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .modal-content {
            background: white;
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Add more styles as needed */
    </style>
</head>
<body>
    <!-- Login Form -->
    <div id="loginForm" class="login-container">
        <!-- Previous login content -->
    </div>

    <!-- Admin Dashboard -->
    <div id="adminPanel" class="dashboard-container hidden">
        <div class="header">
            <div class="logo">
                <i class="fas fa-print"></i>
                <span>E Printing Admin</span>
            </div>
            <div class="admin-profile">
                <div class="admin-avatar">A</div>
                <div class="admin-name">Admin</div>
            </div>
        </div>

        <div class="main-content">
            <!-- Sidebar Navigation -->
            <div class="sidebar">
                <div class="nav-item active" id="dashboardTab"><i class="fas fa-home"></i> Dashboard</div>
                <div class="nav-item" id="ordersTab"><i class="fas fa-box"></i> Orders</div>
                <div class="nav-item" id="analyticsTab"><i class="fas fa-chart-bar"></i> Analytics</div>
                <div class="nav-item" id="settingsTab"><i class="fas fa-cog"></i> Settings</div>
                <div class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</div>
            </div>

            <!-- Main Content Areas -->
            <div class="content-area">
                <!-- Dashboard -->
                <div id="dashboardSection">
                    <div class="stats-grid">
                        <div class="card clickable" id="totalOrdersCard">
                            <h3>Total Orders</h3>
                            <div class="value">0</div>
                        </div>
                        <div class="card clickable" id="pendingOrdersCard">
                            <h3>Pending Orders</h3>
                            <div class="value">0</div>
                        </div>
                        <div class="card">
                            <h3>Total Revenue</h3>
                            <div class="value">৳0</div>
                        </div>
                        <div class="card">
                            <h3>Total Costs</h3>
                            <div class="value">৳0</div>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>

                <!-- Orders Management -->
                <div id="ordersSection" class="hidden">
                    <!-- Order List and Add Order Forms -->
                </div>

                <!-- Analytics -->
                <div id="analyticsSection" class="hidden">
                    <div class="time-filter">
                        <select id="timePeriod" class="form-control">
                            <option value="all">All Time</option>
                            <option value="monthly">Monthly</option>
                        </select>
                    </div>
                    <div class="chart-container">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>

                <!-- Settings -->
                <div id="settingsSection" class="hidden">
                    <div class="card">
                        <h2>Company Settings</h2>
                        <form id="companySettings">
                            <div class="form-group">
                                <label>Company Name</label>
                                <input type="text" id="companyName" required>
                            </div>
                            <div class="form-group">
                                <label>Shipping From Address</label>
                                <textarea id="companyAddress" required></textarea>
                            </div>
                            <button type="submit" class="btn primary">Save Settings</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="editOrderModal" class="modal">
        <div class="modal-content">
            <h2>Edit Order</h2>
            <!-- Edit Form -->
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
